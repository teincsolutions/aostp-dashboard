name: CI/CD Pipeline

on:
  push:
    branches: [main, test]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  DOCKER_IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/aostp-dashboard
  NODE_ENV: production
  NODE_VERSION: '20'

jobs:
  build:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    outputs:
      docker_tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Generate Docker tag
        id: tag
        run: echo "tag=${{ github.run_number }}-$(echo ${GITHUB_SHA} | cut -c1-7)" >> $GITHUB_OUTPUT

      - name: Login to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin

      - name: Build and push Docker image
        run: |
          docker build --target production \
            --build-arg NEXT_PUBLIC_API_BASE_URL=${{ env.NEXT_PUBLIC_API_BASE_URL }} \
            --build-arg NEXT_PUBLIC_WS_URL=${{ env.NEXT_PUBLIC_WS_URL }} \
            --tag ${{ env.DOCKER_IMAGE_NAME }}:${{ steps.tag.outputs.tag }} \
            --tag ${{ env.DOCKER_IMAGE_NAME }}:latest \
            .
          docker push ${{ env.DOCKER_IMAGE_NAME }}:${{ steps.tag.outputs.tag }}
          docker push ${{ env.DOCKER_IMAGE_NAME }}:latest
        env:
          NEXT_PUBLIC_API_BASE_URL: https://api.akomapacargo.com/api/v1
          NEXT_PUBLIC_WS_URL: wss://api.akomapacargo.com

  deploy:
    name: Deploy to Production
    needs: [build]
    if: github.ref_name == 'main' && github.event_name == 'push'
    runs-on: [self-hosted, aostp-runner]
    environment:
      name: production
      url: https://aostp.akomapacargo.com
    env:
      DOCKER_TAG: ${{ needs.build.outputs.docker_tag }}
      DOCKER_IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/aostp-dashboard
      NEXT_PUBLIC_API_BASE_URL: https://api.akomapacargo.com/api/v1
      NEXT_PUBLIC_WS_URL: wss://api.akomapacargo.com
    steps:
      - uses: actions/checkout@v4

      - name: Validate secrets
        run: |
          MISSING=()
          [[ -z "$GOOGLE_CLIENT_ID" ]] && MISSING+=("GOOGLE_CLIENT_ID")
          if [[ ${#MISSING[@]} -gt 0 ]]; then
            echo "::error::Missing required secrets:"
            for item in "${MISSING[@]}"; do echo "::error::  - $item"; done
            exit 1
          fi
          echo "All required secrets are present."
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}

      - name: Generate .env.production file
        env:
          NEXT_PUBLIC_API_BASE_URL: ${{ env.NEXT_PUBLIC_API_BASE_URL }}
          NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          NEXT_PUBLIC_WS_URL: ${{ env.NEXT_PUBLIC_WS_URL }}
          NODE_ENV: ${{ env.NODE_ENV }}
        run: envsubst < .env.template > .env.production

      - name: Login to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin

      - name: Save previous image tag for rollback
        run: |
          PREV_TAG=$(docker inspect aostp-dashboard-prod --format '{{index .Config.Image}}' 2>/dev/null | rev | cut -d: -f1 | rev || echo "")
          if [ -n "$PREV_TAG" ] && [ "$PREV_TAG" != "$DOCKER_TAG" ]; then
            echo "$PREV_TAG" > /tmp/aostp-dashboard-previous-tag.txt
            echo "Saved previous tag: $PREV_TAG"
          else
            echo "No previous tag to save"
          fi

      - name: Stop existing containers
        run: |
          docker compose -f docker-compose.production.yml down --remove-orphans 2>/dev/null || true
          docker rm -f aostp-dashboard-prod 2>/dev/null || true

      - name: Deploy with docker-compose
        run: |
          docker compose -f docker-compose.production.yml pull
          docker compose -f docker-compose.production.yml up -d

      - name: Wait for container readiness
        run: sleep 20

      - name: Health check
        run: |
          for i in {1..5}; do
            if curl -f http://localhost:8080 > /dev/null 2>&1; then
              echo "✅ Health check passed"
              break
            fi
            if [ $i -eq 5 ]; then
              echo "❌ Health check failed after 5 attempts"
              docker logs aostp-dashboard-prod || true
              exit 1
            fi
            echo "Waiting... (attempt $i/5)"
            sleep 10
          done

      - name: Cleanup docker images (keep last 3)
        run: |
          docker images "${{ env.DOCKER_IMAGE_NAME }}" --format "{{.Tag}}" | grep -E "^[0-9]+" | sort -n | head -n -3 | xargs -r -I {} docker rmi "${{ env.DOCKER_IMAGE_NAME}}:{}" || true
          docker image prune -f || true

      - name: Cleanup env file
        run: rm -f .env.production

      - name: Send Slack success notification
        if: success()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          curl -X POST -H "Content-type: application/json" \
            --data '{"text":"✅ AOSTP Dashboard production deployment successful\nCommit: ${{ github.sha }}\nTag: ${{ env.DOCKER_TAG }}"}' \
            "$SLACK_WEBHOOK_URL" || true

      - name: Send Slack failure notification
        if: failure()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          curl -X POST -H "Content-type: application/json" \
            --data '{"text":"❌ AOSTP Dashboard production deployment failed\nCommit: ${{ github.sha }}\nBuild: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"}' \
            "$SLACK_WEBHOOK_URL" || true